<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="description" content="Monitor ao vivo Nexa · Fenabrave" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexa View" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Nexa View</title>

    <style>
      html {
        background: #0a0a0c;
      }
      /* First-paint splash: avoids a white flash before React mounts. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0c;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot i {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 2px solid #1f2125;
        border-top-color: #4c8df5;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><i></i></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
